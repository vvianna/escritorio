# Escritório do time de agentes do Hermes (fork do Habblaud), SÓ LEITURA e SÓ pela Tailscale.
#
# Regras (spec time-de-agentes, fase 4, escritorio.md "Regras de segurança"):
#   - porta publicada SÓ no IP Tailscale do Gargantua (100.83.157.12): nada em 0.0.0.0 nem em 127.0.0.1,
#     nada de túnel. O IP fica fixo aqui de propósito (não vem do .env);
#   - nenhuma montagem gravável: os bancos do Hermes entram read-only pelo docker-compose.override.yml
#     gerado por `bash tools/gerar-montagens.sh` (só kanban.db e state.db, nunca .env/auth.json/config.yaml);
#     o estado do próprio escritório (/data) e o /tmp ficam em tmpfs (memória, some ao parar);
#   - rotas de escrita desligadas no BUILD (server/somente-leitura.ts): o Dockerfile roda o build padrão;
#   - NÃO use `npm run docker:up` (é o fluxo do Habblaud: monta as pastas do Claude Code).
#
# Ligar é passo do Victor: `bash tools/gerar-montagens.sh && docker compose up -d --build`.
# Desligar (= desfazer a fase 4): `docker compose down`.
name: escritorio

services:
  escritorio:
    build: .
    image: escritorio:local
    container_name: escritorio
    restart: unless-stopped
    ports:
      - "100.83.157.12:${ESCRITORIO_PORTA:-4317}:4747"
    environment:
      # Nome extra aceito no cabeçalho Host (IPs, como 100.83.157.12, sempre valem).
      HABBLAUD_ALLOWED_HOSTS: ${ESCRITORIO_HOSTS:-gargantua}
      HABBLAUD_BIND: 100.83.157.12
      # Redundante com a flag de build, mas explícito: nada de terminal, mensagens, Codex, timelapse nem GitHub.
      HABBLAUD_TERMINAL: "0"
      HABBLAUD_MENSAGENS: "0"
      HABBLAUD_CODEX: "0"
      HABBLAUD_TIMELINE: "0"
      HABBLAUD_UPDATE_CHECK: "0"
      # Onde as fontes do Hermes (server/sources/hermes.ts) acham os bancos montados pelo override.
      HERMES_ROOT: /hermes
      ESCRITORIO_PLANTAO_DIR: /plantao/incidentes
    volumes:
      - type: bind
        source: ${HOME}/.local/state/plantao/incidentes
        target: /plantao/incidentes
        read_only: true
        bind:
          create_host_path: false
    # Endurecimento: sistema de arquivos só leitura; /data e /tmp em memória; sem capabilities extras.
    read_only: true
    tmpfs:
      - /tmp
      - /data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Processo init mínimo: repassa sinais e recolhe processos órfãos.
    init: true
